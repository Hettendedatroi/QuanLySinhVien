<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập - Quản lý hàng hóa</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f6fb; color: #172033; margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { background: #fff; width: min(90vw, 390px); padding: 2rem; border-radius: 12px; box-shadow: 0 12px 35px #1720331a; }
    h1 { margin-top: 0; font-size: 1.6rem; }
    label { display: block; margin: 1rem 0 .35rem; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: .75rem; border: 1px solid #cbd3e1; border-radius: 6px; font: inherit; }
    button { margin-top: 1.2rem; width: 100%; padding: .8rem; background: #2457d6; color: #fff; border: 0; border-radius: 6px; font: inherit; font-weight: 700; cursor: pointer; }
    .switch { margin-top: 1rem; text-align: center; }
    .switch button { width: auto; margin: 0; padding: 0; background: none; color: #2457d6; }
    #message { min-height: 1.4em; margin-top: 1rem; }
    #message.error { color: #b42318; }
    #message.success { color: #16794a; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <section id="login-panel">
      <h1>Đăng nhập</h1>
      <form id="login-form">
        <label for="login-username">Tên đăng nhập</label>
        <input id="login-username" name="username" autocomplete="username" minlength="3" maxlength="50" required>
        <label for="login-password">Mật khẩu</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required>
        <button type="submit">Đăng nhập</button>
      </form>
      <p class="switch">Chưa có tài khoản? <button type="button" id="show-register">Đăng ký</button></p>
    </section>

    <section id="register-panel" hidden>
      <h1>Tạo tài khoản</h1>
      <form id="register-form">
        <label for="register-username">Tên đăng nhập</label>
        <input id="register-username" name="username" autocomplete="username" minlength="3" maxlength="50" required>
        <label for="register-password">Mật khẩu (ít nhất 8 ký tự)</label>
        <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        <button type="submit">Đăng ký</button>
      </form>
      <p class="switch">Đã có tài khoản? <button type="button" id="show-login">Đăng nhập</button></p>
    </section>

    <section id="signed-in-panel" hidden>
      <h1>Đã đăng nhập</h1>
      <p>Xin chào, <strong id="signed-in-username"></strong>.</p>
      <p>Bạn có thể truy cập API quản lý hàng hóa khi đã đăng nhập.</p>
      <button type="button" id="logout-button">Đăng xuất</button>
    </section>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <script>
    const loginPanel = document.getElementById("login-panel");
    const registerPanel = document.getElementById("register-panel");
    const signedInPanel = document.getElementById("signed-in-panel");
    const message = document.getElementById("message");

    function showMessage(text, isError) {
      message.textContent = text;
      message.className = isError ? "error" : "success";
    }

    function showSignedIn(username) {
      loginPanel.hidden = true;
      registerPanel.hidden = true;
      signedInPanel.hidden = false;
      document.getElementById("signed-in-username").textContent = username;
    }

    async function sendForm(url, form) {
      const values = Object.fromEntries(new FormData(form).entries());
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(values)
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(result.detail || result.title || result.message || "Không thể thực hiện yêu cầu.");
      }
      return result;
    }

    document.getElementById("show-register").addEventListener("click", () => {
      loginPanel.hidden = true;
      registerPanel.hidden = false;
      showMessage("", false);
    });
    document.getElementById("show-login").addEventListener("click", () => {
      registerPanel.hidden = true;
      loginPanel.hidden = false;
      showMessage("", false);
    });
    document.getElementById("register-form").addEventListener("submit", async event => {
      event.preventDefault();
      const form = event.currentTarget;
      try {
        const result = await sendForm("/api/auth/register", form);
        document.getElementById("login-username").value = document.getElementById("register-username").value;
        form.reset();
        registerPanel.hidden = true;
        loginPanel.hidden = false;
        showMessage(result.message, false);
      } catch (error) {
        showMessage(error.message, true);
      }
    });
    document.getElementById("login-form").addEventListener("submit", async event => {
      event.preventDefault();
      const form = event.currentTarget;
      try {
        const result = await sendForm("/api/auth/login", form);
        form.reset();
        showMessage(result.message, false);
        showSignedIn(result.username);
      } catch (error) {
        showMessage(error.message, true);
      }
    });
    document.getElementById("logout-button").addEventListener("click", async () => {
      try {
        const response = await fetch("/api/auth/logout", { method: "POST" });
        if (!response.ok) throw new Error("Không thể đăng xuất.");
        signedInPanel.hidden = true;
        loginPanel.hidden = false;
        showMessage("Đã đăng xuất.", false);
      } catch (error) {
        showMessage(error.message, true);
      }
    });
    fetch("/api/auth/me")
      .then(response => response.ok ? response.json() : null)
      .then(user => { if (user) showSignedIn(user.username); })
      .catch(() => showMessage("Không thể kiểm tra trạng thái đăng nhập.", true));
  </script>
</body>
</html>
